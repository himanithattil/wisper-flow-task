<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Where To? Vacation Planner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#eef3f1;--card:#fff;--ink:#0f2b3d;--mute:#5b7080;--line:#d5dfdc;--sea:#1f7a8c;--sun:#f2a900;--sunink:#3a2a00;--ok:#1b7a4b;--bad:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1a24;--card:#142a38;--ink:#e8f1f5;--mute:#93a9b7;--line:#254153;--sea:#4fb3c6;--ok:#58c58d;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#0c1a24;--card:#142a38;--ink:#e8f1f5;--mute:#93a9b7;--line:#254153;--sea:#4fb3c6;--ok:#58c58d;--bad:#ff8a80}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'DM Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;margin:0;line-height:1.1}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
.brand{font:800 22px 'Bricolage Grotesque',sans-serif;display:flex;align-items:center;gap:8px;margin-bottom:14px}
.brand i{width:14px;height:14px;border-radius:50%;background:var(--sun);display:inline-block}
.prog{display:flex;gap:6px;margin-bottom:22px}
.prog b{flex:1;height:5px;border-radius:3px;background:var(--line)}
.prog b.on{background:var(--sea)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
h2{font-size:30px;margin-bottom:6px}
.sub{color:var(--mute);margin:0 0 20px}
label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
input,select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 16px;border:1.5px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:500 15px 'DM Sans',sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.moods{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.mood{text-align:left;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.mood strong{display:block;font-size:17px}.mood span{color:var(--mute);font-size:13px}
.mood[aria-pressed="true"]{border-color:var(--sea);box-shadow:inset 0 0 0 2px var(--sea)}
.row{display:flex;gap:12px}.row>*{flex:1}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:24px}
.btn{padding:13px 22px;border-radius:10px;border:0;font:700 16px 'DM Sans',sans-serif;cursor:pointer;background:var(--sun);color:var(--sunink);text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.err{color:var(--bad);font-size:14px;margin-top:10px;min-height:20px}
.pass{background:var(--ink);color:var(--bg);border-radius:18px;padding:24px;position:relative;overflow:hidden}
.pass h2{font-size:38px;color:var(--bg)}
.pass .route{opacity:.8;margin:4px 0 16px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;border-top:2px dashed rgba(255,255,255,.3);padding-top:16px}
.tiles div small{display:block;opacity:.7;font-size:12px}.tiles div b{font:800 22px 'Bricolage Grotesque',sans-serif}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;margin-top:10px}
.tag.ok{background:var(--sun);color:var(--sunink)}.tag.bad{background:var(--bad);color:#fff}
section.blk{margin-top:18px}
section.blk h3{font-size:21px;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
td:last-child,th:last-child{text-align:right}
.scroll{overflow-x:auto}
tr.pick td{font-weight:700;color:var(--sea)}
ol.days{margin:0;padding-left:20px}ol.days li{margin-bottom:10px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{padding:10px 14px;border:1.5px solid var(--sea);border-radius:10px;color:var(--sea);font-weight:700;text-decoration:none;font-size:14px}
.note{color:var(--mute);font-size:13px;margin-top:10px}
@media(max-width:480px){.row{flex-direction:column}.tiles b{font-size:18px}h2{font-size:26px}}
</style>
</head>

const MOODS=[['E','Educational','History, heritage, museums'],['F','Fun','Beaches, city life, nightlife'],['R','Relaxing','Slow days, views, good sleep'],['A','Adventure','Treks, safaris, water sports'],['S','Spiritual','Temples, ghats, yoga'],['N','Nature','Hills, wildlife, open skies']];
const PRESETS=[3000,7000,15000,30000,75000,150000];
const CUR={INR:1,USD:83,EUR:90,GBP:105,AED:22.6,SGD:62,AUD:55,CAD:61,JPY:0.55},SYM={INR:'₹',USD:'$',EUR:'€',GBP:'£',AED:'AED ',SGD:'S$',AUD:'A$',CAD:'C$',JPY:'¥'};
function money(n){const c=st.cur;return SYM[c]+Math.round(n/CUR[c]).toLocaleString(c==='INR'?'en-IN':'en-US')}
function keep(){const g=i=>$(i)?$(i).value:'';st.days=g('dy');st.people=g('pp');if(st.custom&&+g('cb'))st.budget=+g('cb')*CUR[st.cur]}
let st={step:1,name:'',email:'',origin:'Anand',budget:7000,custom:false,days:'',people:'',cur:'INR',moods:[],mode:'any',pick:0};
try{const s=JSON.parse(localStorage.getItem('wt_user')||'{}');if(s.name){st.name=s.name;st.email=s.email||'';}}catch(e){}
const $=id=>document.getElementById(id), app=$('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>money(n);
const hrs=h=>{const m=Math.round(h*60);return Math.floor(m/60)+'h '+(m%60?m%60+'m':'')};
function hav(a,b){const r=x=>x*Math.PI/180,R=6371,dl=r(b[0]-a[0]),dn=r(b[1]-a[1]);const q=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function modes(km,n){ // km = one-way road km; costs are per person, round trip
 const cars=Math.ceil(n/4),o=[];
 o.push({k:'car',l:'Car (self or cab)',c:cars*km*2*10/n,t:km/55});
 o.push({k:'train',l:'Train',c:Math.max(250,km*1.6)*2,t:km/50+0.5});
 o.push({k:'bus',l:'Bus',c:Math.max(200,km*1.3)*2,t:km/45});
 if(km>3500)o.length=0;
 if(km>=450){const a=km/1.3;o.push({k:'flight',l:'Flight',c:(2200+a*3.5)*2,t:a/800+3+(a>4000?2:0)})}
 return o}
function build(){
 const O=CITIES[st.origin],n=st.people,nights=Math.max(1,st.days-1),rooms=Math.ceil(n/2),res=[];
 for(const d of D){
  const air=hav(O,[d.la,d.lo]);if(air<40)continue;const km=air*1.3;
  const LIM={car:700,bus:1200,train:3500,flight:1e9};
  let ms=modes(km,n).filter(m=>m.t<=6+st.days*4&&km<=LIM[m.k]&&(m.k==='flight'||!d.x));
  if(st.mode!=='any')ms=ms.filter(m=>m.k===st.mode);
  if(!ms.length)continue;
  ms.sort((a,b)=>a.c-b.c);const m=ms[0];
  const hotel=d.h*rooms*nights/n,food=d.f*st.days,local=250*st.days,total=m.c+hotel+food+local;
  const sc=st.moods.length?st.moods.reduce((s,k)=>s+(d.m[k]||0),0)/(3*st.moods.length):0.5;
  res.push({d,km,m,all:modes(km,n),hotel,food,local,total,sc,ok:total<=st.budget});
 }
 const ok=res.filter(r=>r.ok).sort((a,b)=>b.sc-a.sc||a.total-b.total);
 return ok.length?ok:res.sort((a,b)=>a.total-b.total).slice(0,3)}
function prog(){$('prog').innerHTML=[1,2,3,4,5].map(i=>`<b class="${i<=st.step?'on':''}"></b>`).join('')}
function save(){try{localStorage.setItem('wt_user',JSON.stringify({name:st.name,email:st.email}))}catch(e){}}
function go(s){st.step=s;render();window.scrollTo(0,0)}
function nav(back,label,fn){return `<div class="nav">${back?`<button class="btn ghost" onclick="go(${st.step-1})">Back</button>`:'<span></span>'}<button class="btn" onclick="${fn}">${label}</button></div>`}
function render(){prog();
 if(st.step===1){app.innerHTML=`<div class="card"><h2>Let's find your next getaway</h2><p class="sub">Sign in so we can save your trip.</p>
 <label for="nm">Your name</label><input id="nm" autocomplete="name" value="${esc(st.name)}">
 <label for="em">Email</label><input id="em" type="email" autocomplete="email" value="${esc(st.email)}">
 <div class="err" id="err" role="alert"></div>${nav(false,'Sign in','s1()')}
 <p class="note">Demo sign-in: details stay in this browser only.</p></div>`}
 if(st.step===2){app.innerHTML=`<div class="card"><h2>Hi ${esc(st.name.split(' ')[0])}, where are you starting from?</h2><p class="sub">Start typing your city, anywhere in India or the world. Distances and travel costs are worked out from here.</p>
 <label for="og">Start location</label><input id="og" list="cl" autocomplete="off" placeholder="Any city, town or village" value="${esc(st.origin)}"><datalist id="cl">${Object.keys(CITIES).sort().map(c=>`<option value="${esc(c)}">`).join('')}</datalist><p class="note">Not in the suggestions? Just type the place name (add the state for a small village) and we will find it.</p>
 <div class="err" id="err" role="alert"></div>${nav(true,'Next: budget','s2()')}</div>`}
 if(st.step===3){app.innerHTML=`<div class="card"><h2>What's your budget?</h2><p class="sub">Total per person for the whole trip: travel, stay and food.</p>
 <label for="cu">Currency</label><select id="cu" onchange="keep();st.cur=this.value;render()">${Object.keys(CUR).map(c=>`<option ${c===st.cur?'selected':''}>${c}</option>`).join('')}</select><label>Budget per person</label>
 <div class="chips" id="pr">${PRESETS.map(p=>`<button class="chip" aria-pressed="${!st.custom&&st.budget===p}" onclick="keep();st.custom=false;st.budget=${p};render()">${inr(p)}</button>`).join('')}<button class="chip" aria-pressed="${st.custom}" onclick="keep();st.custom=true;render()">Enter my own</button></div>
 ${st.custom?`<label for="cb">Your budget per person (${st.cur})</label><input id="cb" type="number" min="1" placeholder="e.g. 20000" value="${Math.round(st.budget/CUR[st.cur])}">`:''}
 <div class="row"><div><label for="dy">Number of days</label><input id="dy" type="number" min="1" max="60" placeholder="e.g. 4" value="${st.days}"></div>
 <div><label for="pp">Number of travellers</label><input id="pp" type="number" min="1" max="500" placeholder="e.g. 20" value="${st.people}"></div></div>
 <div class="err" id="err" role="alert"></div>${nav(true,'Next: mood','s3()')}</div>`}
 if(st.step===4){app.innerHTML=`<div class="card"><h2>What kind of holiday do you want?</h2><p class="sub">Pick your mood first: we choose places that match it. How you travel sets how far we look. Car stays nearby, train goes across India, and flights can go abroad.</p>
 <div class="moods">${MOODS.map(([k,l,d])=>`<button class="mood" aria-pressed="${st.moods.includes(k)}" onclick="tm('${k}')"><strong>${l}</strong><span>${d}</span></button>`).join('')}</div>
 <label>Travel by</label><div class="chips">${[['any','Best price'],['car','Car (nearby)'],['train','Train (far, in India)'],['bus','Bus (regional)'],['flight','Flight (anywhere)']].map(([k,l])=>`<button class="chip" aria-pressed="${st.mode===k}" onclick="st.mode='${k}';render()">${l}</button>`).join('')}</div>
 <div class="err" id="err" role="alert"></div>${nav(true,'Show my plan','s4()')}</div>`}
 if(st.step===5)plan()}
function s1(){const n=$('nm').value.trim(),e=$('em').value.trim();if(!n||!/\S+@\S+\.\S+/.test(e)){$('err').textContent='Enter your name and a valid email to continue.';return}st.name=n;st.email=e;save();go(2)}
async function s2(){const raw=$('og').value.trim().slice(0,60),v=raw.toLowerCase(),a=(ALIAS[v]||v).toLowerCase(),k=Object.keys(CITIES).find(c=>c.toLowerCase()===a),e=$('err');
 if(k){st.origin=k;return go(3)}
 if(!raw){e.textContent='Enter your start city.';return}
 e.textContent='Looking up '+raw+'...';
 try{const sm=await claude.use('sample');if(!sm){e.textContent='Place search is not available here. Pick the nearest city from the suggestions.';return}
  const r=await sm.json('Find this place on a map: "'+raw.replace(/"/g,'')+'". If several places share the name, pick the best-known one, preferring India. Reply with only JSON: {"found":true,"name":"Place, State, Country","lat":0,"lng":0} using real coordinates, or {"found":false}.',{modelTier:'quick'});
  if(!r||!r.found||!isFinite(r.lat)||!isFinite(r.lng)||Math.abs(r.lat)>90||Math.abs(r.lng)>180){e.textContent='Could not find "'+raw+'". Check the spelling or add the state, for example "Anand, Gujarat".';return}
  const nm=String(r.name||raw).slice(0,80);CITIES[nm]=[+r.lat,+r.lng];st.origin=nm;go(3)
 }catch(x){e.textContent=x&&x.code==='not_granted'?'Allow place search to continue, or pick a city from the suggestions.':'Place search failed. Try again or pick a nearby city from the list.'}}
function s3(){let b=st.budget;if(st.custom){const v=+$('cb').value;if(!v||v*CUR[st.cur]<500){$('err').textContent='Enter a budget of at least ₹500 or the equivalent.';return}b=v*CUR[st.cur]}const d=Math.floor(+$('dy').value),p=Math.floor(+$('pp').value);if(!(d>=1&&d<=60)){$('err').textContent='Enter the number of days (1 to 60).';return}if(!(p>=1&&p<=500)){$('err').textContent='Enter the number of travellers (1 to 500).';return}st.budget=b;st.days=d;st.people=p;go(4)}
function tm(k){st.moods=st.moods.includes(k)?st.moods.filter(x=>x!==k):[...st.moods,k];render()}
function s4(){if(!st.moods.length){$('err').textContent='Pick at least one mood.';return}st.pick=0;go(5)}
function q(s){return encodeURIComponent(s)}
function plan(){
 const R=build();if(!R.length){app.innerHTML=`<div class="card"><h2>No trips match</h2><p class="sub">Try a different travel mode or more days.</p>${nav(true,'Edit','go(4)')}</div>`;return}
 const r=R[Math.min(st.pick,R.length-1)],d=r.d,m=r.m,n=st.people,over=r.total-st.budget,city=d.n.split(/,| and /)[0];
 const itin=[];for(let i=1;i<=st.days;i++){
  const h=d.hl[(i-1)%d.hl.length];
  itin.push(i===1?`Travel from ${st.origin} by ${m.l.toLowerCase()} (about ${hrs(m.t)}), check in, then ${h.toLowerCase()}.`:i===st.days?`Easy morning, last meal and shopping, then travel home (about ${hrs(m.t)}).`:h+'.')}
 app.innerHTML=`<div class="pass"><div>${esc(st.name)}'s trip</div><h2>${esc(d.n)}</h2>
 <div class="route">${esc(st.origin)} to ${esc(city)} · ${Math.round(r.km)} km · ${st.days} days · ${n} traveller${n>1?'s':''}</div>
 <div class="tiles"><div><small>Per person</small><b>${inr(r.total)}</b></div><div><small>Group total</small><b>${inr(r.total*n)}</b></div><div><small>One-way by ${m.k}</small><b>${hrs(m.t)}</b></div></div>
 <span class="tag ${over<=0?'ok':'bad'}">${over<=0?'Within budget: '+inr(-over)+' to spare':'Over budget by '+inr(over)+' per person'}</span></div>
 ${R.length>1?`<section class="blk"><h3>Other trips for you</h3><div class="chips">${R.slice(0,6).map((x,i)=>`<button class="chip" aria-pressed="${i===st.pick}" onclick="st.pick=${i};render()">${esc(x.d.n)} · ${inr(x.total)}</button>`).join('')}</div></section>`:''}
 <div class="card" style="margin-top:18px"><section class="blk" style="margin-top:0"><h3>Cost breakdown (per person)</h3><table>
 <tr><td>Round trip by ${m.l.toLowerCase()}</td><td>${inr(m.c)}</td></tr>
 <tr><td>Hotel, ${Math.max(1,st.days-1)} night${st.days>2?'s':''} (shared rooms)</td><td>${inr(r.hotel)}</td></tr>
 <tr><td>Food, ${st.days} days</td><td>${inr(r.food)}</td></tr>
 <tr><td>Local transport and entry tickets</td><td>${inr(r.local)}</td></tr>
 <tr><th>Total</th><th>${inr(r.total)}</th></tr></table></section>
 <section class="blk"><h3>Getting there</h3><div class="scroll"><table><tr><th>Mode</th><th>Time one-way</th><th>Cost per person</th></tr>
 ${r.all.sort((a,b)=>a.c-b.c).map(x=>`<tr class="${x.k===m.k?'pick':''}"><td>${x.l}</td><td>${hrs(x.t)}</td><td>${inr(x.c)}</td></tr>`).join('')}</table></div></section>
 <section class="blk"><h3>Day by day</h3><ol class="days">${itin.map(t=>`<li>${esc(t)}</li>`).join('')}</ol></section>
 <section class="blk"><h3>Book hotels</h3><div class="links">
 <a href="https://www.booking.com/searchresults.html?ss=${q(city)}&group_adults=${n}" target="_blank" rel="noopener">Booking.com in ${esc(city)}</a>
 <a href="https://www.google.com/travel/hotels/${q(city)}" target="_blank" rel="noopener">Google Hotels</a>
 <a href="https://www.google.com/maps/search/hotels+in+${q(city)}" target="_blank" rel="noopener">Hotels on map</a></div></section>
 <section class="blk"><h3>Book your travel</h3><div class="links">
 <a href="https://www.google.com/search?q=${q('outstation cab '+st.origin+' to '+city)}" target="_blank" rel="noopener">Book a cab or driver</a>
 <a href="https://www.irctc.co.in/nget/train-search" target="_blank" rel="noopener">Trains on IRCTC</a>
 <a href="https://www.redbus.in/" target="_blank" rel="noopener">Buses on redBus</a>
 ${r.all.some(x=>x.k==='flight')?`<a href="https://www.google.com/travel/flights?q=${q('Flights from '+st.origin+' to '+city)}" target="_blank" rel="noopener">Search flights</a>`:''}</div>
 <p class="note">Costs are estimates from average fares and distance, and currency rates are approximate. Check live prices before you pay.${n>=10?' For groups of 10 or more, ask hotels and operators for group rates, and look at a tempo traveller or coach.':''}${(d.x||!isIN(st.origin))?' This looks like an international trip: check passport, visa and travel insurance requirements.':''}</p></section></div>
 <div class="nav"><button class="btn ghost" onclick="go(4)">Change mood</button><button class="btn" onclick="go(3)">Change budget</button></div>`}
render();
</script>
